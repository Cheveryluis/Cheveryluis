<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TaxiCentral — Historia 1080x1920</title>
<link rel="stylesheet" href="comun.css">
<style>
  body { width: 1080px; height: 1920px; overflow: hidden; }
  .lienzo {
    width: 1080px; height: 1920px; position: relative; overflow: hidden; color: #fff;
    background: radial-gradient(90% 50% at 90% 0%, #2c3150 0%, var(--noche) 60%);
    padding: 110px 80px 0; display: flex; flex-direction: column;
  }
  .marca { font-size: 48px; color: #fff; }
  h1 { font-size: 92px; line-height: 1.02; font-weight: 900; letter-spacing: -.02em; margin-top: 44px; }
  h1 em { font-style: normal; color: var(--oro); }
  .sub { font-size: 36px; line-height: 1.4; color: #c8cbe0; margin-top: 30px; }
  .laptop { margin: 56px -40px 0; font-size: 22px; }
  .lista { margin-top: 64px; display: flex; flex-direction: column; gap: 26px; }
  .fila { display: flex; gap: 26px; align-items: center; font-size: 36px; font-weight: 600; }
  .fila .icono { font-size: 30px; background: rgba(230,168,23,.14); border: 1px solid rgba(230,168,23,.4); }
  .cta {
    margin-top: auto; margin-bottom: 120px; text-align: center;
    background: var(--oro); color: var(--noche); border-radius: 28px; padding: 40px 30px;
  }
  .cta h2 { font-size: 52px; font-weight: 900; line-height: 1.1; }
  .cta p { font-size: 36px; font-weight: 600; margin-top: 14px; }
</style>
</head>
<body>
<div class="lienzo">
  <div class="marca"><img src="img/logo.png" alt=""><span>Taxi<b>Central</b></span></div>
  <h1>Despache cada carrera <em>en segundos.</em></h1>
  <p class="sub">El software de despacho para cooperativas y centrales de taxi.</p>
  <div class="laptop">
    <div class="pantalla"><img class="recorte" src="img/despacho.png" alt=""></div>
    <div class="base"></div>
  </div>
  <div class="lista">
    <div class="fila"><div class="icono"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></div>Identifica al cliente cuando llama</div>
    <div class="fila"><div class="icono"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg></div>Turnos justos entre unidades</div>
    <div class="fila"><div class="icono"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>Cronómetro de cada carrera</div>
    <div class="fila"><div class="icono"><svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></div>Historial y reportes en Excel</div>
  </div>
  <div class="cta">
    <h2>Solicite una demostración</h2>
    <p>WhatsApp: 09X XXX XXXX</p>
  </div>
</div>
</body>
</html>
